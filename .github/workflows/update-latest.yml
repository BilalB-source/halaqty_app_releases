name: Update mobile-latest.json

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag مثل v1.2.2 — اتركه فاضي لأحدث نسخة"
        required: false

permissions:
  contents: write

concurrency:
  group: update-latest
  cancel-in-progress: false

jobs:
  update-json:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Pick release tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" \
                    --exclude-drafts --exclude-pre-releases --limit 100 \
                    --json tagName -q '.[].tagName' | sort -V | tail -n 1)
          fi
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get and validate release JSON
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "Assets in $TAG:"
          echo "$ASSETS"
          JSON_ASSET=$(echo "$ASSETS" | grep -i '\.json$' | head -n 1 || true)
          if [ -z "$JSON_ASSET" ]; then
            echo "::error::No .json file found in release $TAG"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$JSON_ASSET" --output mobile-latest.json --clobber
          if ! jq empty mobile-latest.json; then
            echo "::error::$JSON_ASSET in $TAG is not valid JSON"
            exit 1
          fi
          cat mobile-latest.json

      - name: Mark release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest

      - name: Commit and push
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add mobile-latest.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update mobile-latest.json from $TAG"
          git push
