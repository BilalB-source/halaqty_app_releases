name: Update mobile-latest.json

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag مثل v1.2.2 — اتركه فاضي لأحدث نسخة"
        required: false

permissions:
  contents: write

concurrency:
  group: update-latest
  cancel-in-progress: false

jobs:
  update-json:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Pick release tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" \
                    --exclude-drafts --exclude-pre-releases --limit 100 \
                    --json tagName -q '.[].tagName' | sort -V | tail -n 1)
          fi
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build mobile-latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,body,publishedAt,assets \
          | jq '{
              version: (.tagName | ltrimstr("v")),
              apk_url: ([.assets[] | select(.name | endswith(".apk")) | .url][0]),
              notes: .body,
              published_at: .publishedAt
            }' > mobile-latest.json
          cat mobile-latest.json
          if [ "$(jq -r .apk_url mobile-latest.json)" = "null" ]; then
            echo "::error::No .apk file found in release $TAG"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add mobile-latest.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update mobile-latest.json to $(jq -r .version mobile-latest.json)"
          git pushname: Update mobile-latest.json

